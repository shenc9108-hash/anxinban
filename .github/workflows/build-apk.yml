name: Build Kid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 KEYSTORE_B64"
            exit 1
          fi
          mkdir -p child-android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > child-android/keystore/anxinban.keystore
          SZ=$(stat -c%s child-android/keystore/anxinban.keystore)
          echo "keystore 大小: $SZ"
          [ "$SZ" -gt 1000 ] || { echo "::error::keystore 还原失败"; exit 1; }

      - name: Compute version
        id: ver
        run: |
          VC=${{ github.run_number }}
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$VC" >> "$GITHUB_OUTPUT"
          echo "版本: 1.0.$VC (versionCode=$VC)"

      - name: Build release APK
        working-directory: ./child-android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}

      - name: Pack
        working-directory: ./child-android/app/build/outputs/apk/release
        run: |
          ls -l
          APK=$(ls *.apk | head -1)
          mv "$APK" anxinban.apk
          printf '{"versionCode":%s,"versionName":"%s","builtAt":"%s","sha":"%s"}' \
            '${{ steps.ver.outputs.code }}' '${{ steps.ver.outputs.name }}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '${{ github.sha }}' > version.json
          cat version.json

      # 上传到自建服务器，孩子端从这里拉更新
      - name: Publish to server
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          if [ -z "$UPLOAD_SECRET" ]; then
            echo "::warning::未配置 UPLOAD_SECRET，跳过自动发布"
            exit 0
          fi
          APK=child-android/app/build/outputs/apk/release/anxinban.apk
          echo "APK 大小: $(stat -c%s "$APK") 字节"
          RESP=$(curl -sS --fail-with-body -X POST \
            -H "X-Upload-Secret: $UPLOAD_SECRET" \
            -H "X-Version-Code: ${{ steps.ver.outputs.code }}" \
            -H "X-Version-Name: ${{ steps.ver.outputs.name }}" \
            -H "X-Notes: 自动构建 ${{ github.sha }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            https://shouhu.966099.xyz/api/ci/upload-apk 2>&1) || {
              echo "::error::上传失败: $RESP"
              exit 1
            }
          echo "上传结果: $RESP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnxinbanKid-v${{ steps.ver.outputs.name }}
          path: |
            child-android/app/build/outputs/apk/release/anxinban.apk
            child-android/app/build/outputs/apk/release/version.json
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### ✅ 编译成功"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | v${{ steps.ver.outputs.name }} |"
            echo "| versionCode | ${{ steps.ver.outputs.code }} |"
            echo ""
            echo "已自动发布到：https://shouhu.966099.xyz/apk/anxinban.apk"
            echo ""
            echo "孩子端会在 6 小时内（或打开 App 时）收到更新提示。"
          } >> "$GITHUB_STEP_SUMMARY"
