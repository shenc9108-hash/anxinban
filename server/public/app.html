<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>安心伴 · 家长端</title>
<style>
:root{--bg:#f2f4f0;--card:#fff;--tx:#1d2536;--tx2:#667085;--pri:#3556d8;--pri2:#e6ebff;--ok:#18865c;--ok2:#dff3ea;--bad:#c9302c;--bad2:#fde6e5;--warn2:#fff0d6;--line:#e3e6ec;--nav:60px}
@media(prefers-color-scheme:dark){:root{--bg:#121620;--card:#1b2130;--tx:#eaedf5;--tx2:#9aa3b8;--pri:#8da4ff;--pri2:#26304f;--ok:#5fd3a2;--ok2:#17372b;--bad:#ff8b86;--bad2:#3d1c1c;--warn2:#3b2d14;--line:#2a3247}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--tx2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--pri2);color:var(--pri)}
.chip.ok{background:var(--ok2);color:var(--ok)}
.chip.bad{background:var(--bad2);color:var(--bad)}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--pri2);color:var(--pri);cursor:pointer}
button.f{background:var(--pri);color:#fff}
button.g{background:transparent;color:var(--tx2);padding:6px 10px}
button:disabled{opacity:.45}
input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--tx);min-width:0;font:inherit}
#v{padding:14px 14px 0}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--tx2);font-size:11px}
.nav a.on{color:var(--pri)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px}
.sw{width:44px;height:26px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.sw.on{background:var(--ok)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:21px}

<script>
/* ══════════════ 状态 ══════════════ */
let K = localStorage.getItem('k') || '';
let D = [], RQ = [], AL = [], code = '', TAB = location.hash.replace('#','') || 'home';
let AUTH_FAIL = 0, DEV = null, VER = null;
const $ = s => document.getElementById(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ══════════════ 网络 ══════════════ */
async function api(p, o = {}) {
  let r;
  try {
    r = await fetch('/api/parent/' + p, {
      method: o.method || 'GET',
      headers: { 'x-parent-key': K, 'Content-Type': 'application/json' },
      body: o.body ? JSON.stringify(o.body) : undefined,
      cache: 'no-store'
    });
  } catch (e) { throw 'net'; }

  if (r.status === 401) {
    AUTH_FAIL++;
    if (AUTH_FAIL >= 3) {                       // 连续3次才登出，避免网络抖动
      localStorage.setItem('k_last', K);
      K = ''; localStorage.removeItem('k'); AUTH_FAIL = 0;
      render(); throw 'auth';
    }
    throw 'net';
  }
  AUTH_FAIL = 0;
  if (!r.ok) throw 'net';
  return r.json();
}

/* ══════════════ 工具 ══════════════ */
const pad = n => String(n).padStart(2,'0');
function hhmm(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function ago(t){
  if(!t) return '从未联网';
  const s=(Date.now()-t)/1000;
  if(s<90) return '刚刚';
  if(s<3600) return Math.round(s/60)+' 分钟前';
  if(s<86400) return Math.round(s/3600)+' 小时前';
  return Math.round(s/86400)+' 天前';
}
function dur(ms){
  const m=Math.round(ms/60000);
  if(m>=60) return Math.floor(m/60)+' 小时 '+(m%60)+' 分';
  return (m||1)+' 分钟';
}

  'com.dragon.read':'番茄小说','com.ss.android.ugc.live':'抖音极速版','com.baidu.searchbox':'百度',

};
const appName = p => APP[p] || p.split('.').pop();

/* 会话按天过滤：0=今天 7=近7天 30=近30天 */
function sessionsIn(days){
  const dev = DEV; if(!dev) return [];
  const ss = dev.sessions || [];
  if(days === 0){
    const t0 = new Date(); t0.setHours(0,0,0,0);
    return ss.filter(x => (x.end||0) >= t0.getTime());
  }
  return ss.filter(x => (x.end||0) >= Date.now() - days*86400000);
}
function groupByApp(list){
  const m = {};
  list.forEach(x => { m[x.pkg] = (m[x.pkg]||0) + (x.ms||0); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

/* ══════════════ 路由 ══════════════ */

window.addEventListener('hashchange', () => {

/* ══════════════ 登录 ══════════════ */
function doLogin(){
  const v = ($('kk').value || '').trim();
  if(!v){ alert('请输入家长密钥'); return; }
  K = v; AUTH_FAIL = 0;
  localStorage.setItem('k', K);
  localStorage.setItem('k_last', K);
  load();
}

function viewLogin(){

    </div>

/* ══════════════ 遮罩层（二级页） ══════════════ */

/* ══════════════ 首页 ══════════════ */
const ARTICLES = [
  { id:'a1', t:'3-6 岁，每天屏幕时间别超过 1 小时', s:'世界卫生组织建议',
    b:`<p>世界卫生组织在《5 岁以下儿童身体活动、久坐行为和睡眠指南》中提出：</p>
       <h4>分龄建议</h4>

          • <b>2-3 岁</b>：每天不超过 30 分钟，需家长陪同<br>
          • <b>3-4 岁</b>：每天不超过 1 小时，分段进行<br>
          • <b>5-6 岁</b>：每天不超过 1 小时，优先保证户外活动</p>
       <h4>为什么重要</h4>
       <p>过早、过量的屏幕暴露会影响语言发育、注意力和睡眠质量。屏幕的强光会抑制褪黑素分泌，睡前使用尤其有害。</p>
       <h4>怎么做到</h4>
       <p>1. 用「定时锁定」把睡前 1 小时设为禁用时段<br>
          2. 把学习类 App 加入白名单，避免一刀切<br>
          3. 家长自己也要少玩手机，孩子会模仿</p>` },
  { id:'a2', t:'孩子沉迷短视频，试试这 4 个方法', s:'实操经验',
    b:`<p>短视频的推荐算法就是为「停留时长」设计的，成年人尚且难以自控，何况孩子。</p>
       <h4>1. 设置硬上限，而不是靠自觉</h4>
       <p>用「应用限时」给抖音、快手设 20 分钟。到点自动拦截，比反复提醒有效得多。</p>
       <h4>2. 提供替代选择</h4>
       <p>孩子刷视频往往是因为「没事干」。准备一些替代活动：乐高、拼图、漫画书、户外运动。</p>
       <h4>3. 别在孩子面前刷</h4>

       <p>突然断网、抢手机会引发激烈对抗。提前约定规则，用工具执行，比临时发火有效。</p>` },
  { id:'a3', t:'如何和孩子约定手机使用规则', s:'亲子沟通',
    b:`<p>规则如果只是家长单方面制定，孩子会想办法绕过。一起商量，执行率才高。</p>
       <h4>开一次家庭会议</h4>
       <p>把手机使用写进家庭约定，双方签字。内容包括：</p>
       <p>• 每天可用时长<br>• 什么时段不能用（吃饭、睡前、写作业时）<br>• 哪些 App 优先（学习类）<br>• 违反约定的后果</p>

       <p>允许孩子申请「额外 15 分钟」，但要说明用途。安心伴的「申请再用」功能就是为此设计——孩子主动申请，家长审批，比单方面封锁更少冲突。</p>
       <h4>定期复盘</h4>

  let h = `<h2>首页</h2>`;
  // 设备概览

/* ══════════════ 位置 ══════════════ */
// WGS84 -> GCJ02（高德/腾讯地图需要）
function gcj(lat,lng){
  const a=6378245.0, ee=0.00669342162296594323, PI=Math.PI;
  function tl(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
    r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3; return r;}
  function tg(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
    r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3; return r;}
  let dLat=tl(lng-105,lat-35), dLng=tg(lng-105,lat-35);
  const rad=lat/180*PI; let m=Math.sin(rad); m=1-ee*m*m; const sm=Math.sqrt(m);
  return [lat+dLat*180/((a*(1-ee))/(m*sm)*PI), lng+dLng*180/(a/sm*Math.cos(rad)*PI)];
}

function viewLoc(){
  let h = `<h2>位置</h2>`;
  if(!DEV){ return h + `<div class="card"><div class="empty">还没有绑定设备</div></div>`; }
  const l = DEV.loc;
  if(!l){
    return h + `<div class="card"><div class="empty">孩子端还没有上报位置<br><span class="sub">请在孩子手机上允许「始终允许」定位权限</span></div></div>`;
  }
  const [glat, glng] = gcj(l.lat, l.lng);
  h += `<div class="card">
    <div class="row"><div>
      <b>当前位置</b>
      <div class="sub">${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}</div>
      <div class="sub">精度约 ${Math.round(l.acc||0)} 米 · ${ago(l.ts)}</div>
    </div>
    <a href="https://uri.amap.com/marker?position=${glng.toFixed(6)},${glat.toFixed(6)}&name=孩子位置&src=anxinban&coordinate=gaode&callnative=1" target="_blank" rel="noopener"><button class="f">地图查看</button></a>
    </div>
    <div style="margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line)">
      <a href="https://uri.amap.com/marker?position=${glng.toFixed(6)},${glat.toFixed(6)}&name=孩子位置&src=anxinban&coordinate=gaode&callnative=1" target="_blank" rel="noopener">
      <div style="background:linear-gradient(135deg,var(--pri2),var(--card));padding:36px 12px;text-align:center">
        <div style="font-size:30px">📍</div>
        <div style="margin-top:6px;color:var(--pri)">点击查看地图</div>
        <div class="sub">高德地图 · ${glat.toFixed(4)}, ${glng.toFixed(4)}</div>
      </div></a>
    </div>
  </div>`;

  // 电子围栏
  const fs = DEV.fences || [];
  h += `<div class="card"><h3>电子围栏</h3>`;
  if(!fs.length){
    h += `<div class="sub">还没有设置围栏。孩子进出围栏时会收到提醒。</div>`;
  } else {
    h += fs.map(f => {
      const inn = (DEV.inside||{})[f.id];
      return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div><b>${esc(f.name)}</b><div class="sub">半径 ${f.r} 米</div></div>
        <div class="st"><span class="chip ${inn?'ok':'bad'}">${inn?'在围栏内':'已离开'}</span>
        <button class="g" onclick="delFence('${f.id}')">删</button></div>
      </div>`;
    }).join('');
  }
  h += `<div class="row" style="margin-top:10px">
    <input id="fn" placeholder="围栏名，如 家" style="flex:1">
    <input id="fr" type="number" placeholder="半径米" style="width:78px" value="200">
    <button class="f" onclick="addFence()">添加</button>
  </div>
  <div class="sub" style="margin-top:6px">以当前位置为中心创建围栏</div></div>`;

  // 出行情况
  const trk = (DEV.track || []).filter(p => p.lat && p.lng);
  if(trk.length >= 2){
    // 计算总里程
    let km = 0;
    for(let i=1;i<trk.length;i++){
      const a=trk[i-1], b=trk[i];
      const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
      const h2 = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
      km += R*2*Math.atan2(Math.sqrt(h2), Math.sqrt(1-h2));
    }
    const pts = trk.slice(-300);
    const lats = pts.map(p=>p.lat), lngs = pts.map(p=>p.lng);
    const minLat=Math.min(...lats), maxLat=Math.max(...lats);
    const minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
    const spanLat = maxLat-minLat || 0.001, spanLng = maxLng-minLng || 0.001;

    // 画成简易轨迹图（SVG）
    const W=300, H=160, PAD=14;
    const coords = pts.map(p=>{
      const x = PAD + (p.lng-minLng)/spanLng * (W-PAD*2);
      const y = H-PAD - (p.lat-minLat)/spanLat * (H-PAD*2);
      return [x,y];
    });
    const path = coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');

          <path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
          <circle cx="${first[0].toFixed(1)}" cy="${first[1].toFixed(1)}" r="5" fill="var(--ok)"/>
          <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--bad)"/>

        <span class="sub">● 起点</span><span class="sub" style="color:var(--bad)">● 当前位置</span>
      </div>

  }

  // 围栏提醒记录
  if(AL.length){
    h += `<div class="card"><h3>围栏提醒</h3>` + AL.slice(0,8).map(a =>
      `<div class="kv"><span>${esc(a.text)}</span><span class="sub">${ago(a.ts)}</span></div>`).join('') + `</div>`;
  }
  return h;
}

function viewGuard(){
  if(!DEV) return `<h2>守护</h2><div class="card"><div class="empty">还没有绑定设备</div></div>`;
  const r = DEV.rules || {};
  const id = DEV.id;
  const on = Date.now() - (DEV.seen||0) < 300000;

  let h = `<h2>守护</h2>`;

  // 告警
  if(DEV.adminDisabled){
    h += `<div class="card" style="background:var(--bad2)"><b>⚠️ 防卸载保护已关闭</b>
      <div class="sub" style="margin-top:4px">孩子取消了设备管理器授权，现在可以卸载孩子端。请检查孩子手机。</div></div>`;

  // 手机状态
  h += `<div class="card"><h3>手机状态</h3>
    <div class="kv"><span>管控状态</span><span class="chip ${on?'ok':'bad'}">${on?'正在守护':'已离线'}</span></div>
    <div class="kv"><span>剩余电量</span><b>${DEV.battery ?? '-'}%</b></div>
    <div class="kv"><span>最后联网</span><span>${ago(DEV.seen)}</span></div>
    <div class="kv"><span>设备型号</span><span>${esc(DEV.model||'-')}</span></div>
    <div class="kv"><span>防卸载</span><span class="chip ${DEV.adminDisabled?'bad':'ok'}">${DEV.adminDisabled?'已关闭':'已启用'}</span></div>
  </div>`;

  // 锁定控制
  h += `<div class="card"><h3>锁定控制</h3>
    <div class="row" style="padding:6px 0"><div><b>临时锁定</b><div class="sub">立即锁住手机，孩子无法使用</div></div>
      <div class="sw ${r.locked?'on':''}" onclick="setRule('locked',${!r.locked})"></div></div>
    <div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div><b>定时锁定</b><div class="sub">睡眠时段自动锁定</div></div>
      <div class="sw ${r.timed?'on':''}" onclick="setRule('timed',${!r.timed})"></div></div>
    ${r.timed ? `<div class="row" style="padding:8px 0">
      <span class="sub">锁定时段</span>
      <div class="st"><input type="number" min="0" max="23" value="${r.sleepStart}" style="width:60px" onchange="setRule('sleepStart',+this.value)"> 点
      <span>—</span>
      <input type="number" min="0" max="23" value="${r.sleepEnd}" style="width:60px" onchange="setRule('sleepEnd',+this.value)"> 点</div>
    </div>` : ''}
  </div>`;

  // 时长限制
  h += `<div class="card"><h3>时间限制</h3>
    <div class="row"><span>每日娱乐总时长</span>
      <div class="stepper"><button onclick="setRule('daily',Math.max(0,${r.daily||0}-10))">−</button>
      <b>${r.daily||0} 分</b><button onclick="setRule('daily',${(r.daily||0)+10})">+</button></div></div>
  </div>`;

  // 应用限时
  const lim = r.limits || {};

  if(!es.length) h += `<div class="sub">还没有设置应用限时</div>`;

    `<div class="kv"><span><b>${esc(appName(pk))}</b><div class="sub" style="font-size:11px">${esc(pk)}</div></span>
      <div class="st"><div class="stepper"><button onclick="setLim('${pk}',-5)">−</button><b>${m} 分</b>
      <button onclick="setLim('${pk}',5)">+</button></div>
      <button class="g" onclick="delLim('${pk}')">删</button></div></div>`).join('');
  h += `<div class="row" style="margin-top:10px">
    <input id="pk" placeholder="包名，如 com.tencent.mm" style="flex:1">
    <input id="mn" type="number" placeholder="分钟" style="width:70px">
    <button class="f" onclick="addLim()">加</button></div>
    <div class="sub" style="margin-top:6px">常用：微信 com.tencent.mm · 抖音 com.ss.android.ugc.aweme</div>
  </div>`;

  h += `<div class="card"><h3>学习白名单</h3>

      onchange="setRule('whitelist',this.value.split(',').map(s=>s.trim()).filter(Boolean))">
    </div></div>`;

  // 设备情况
  const dv = DEV.device || {};
  const gb = n => n ? (n / 1073741824).toFixed(1) + ' GB' : '-';
  if (Object.keys(dv).length) {
    const usedPct = dv.storageTotal ? Math.round((1 - dv.storageFree / dv.storageTotal) * 100) : 0;
    h += `<div class="card"><h3>设备情况</h3>
      <div class="kv"><span>品牌型号</span><span>${esc((dv.brand||'') + ' ' + (dv.model||''))}</span></div>
      <div class="kv"><span>系统版本</span><span>Android ${esc(dv.android||'-')}</span></div>
      <div class="kv"><span>存储空间</span><span>${gb(dv.storageTotal - (dv.storageFree||0))} / ${gb(dv.storageTotal)}</span></div>
      <div style="margin-top:8px"><div class="bar"><i style="width:${usedPct}%;background:${usedPct>85?'var(--bad)':'var(--pri)'}"></i></div>
      <div class="sub" style="margin-top:4px">已用 ${usedPct}%</div></div>
      ${dv.memTotal ? `<div class="kv" style="margin-top:8px"><span>运行内存</span><span>剩余 ${gb(dv.memAvail)} / ${gb(dv.memTotal)}</span></div>` : ''}
    </div>`;
  }

  // 孩子端版本
  if (VER) {
    const localVc = dv.appVersionCode || 0;
    const canUpdate = VER.versionCode > localVc;
    h += `<div class="card"><h3>孩子端版本</h3>
      <div class="kv"><span>当前版本</span><b>${dv.appVersionName ? 'v' + esc(dv.appVersionName) : '未知'}</b></div>
      <div class="kv"><span>最新版本</span><span>v${esc(VER.versionName)}</span></div>
      ${canUpdate
        ? `<div class="sub" style="margin-top:8px;color:var(--bad)">有新版本可用，孩子打开孩子端时会收到更新提示</div>`
        : `<div class="sub" style="margin-top:8px;color:var(--ok)">已是最新版本</div>`}
    </div>`;
  }

  // 手机截屏
  h += `<div class="card"><h3>手机截屏</h3>
    <div class="row"><div class="sub">最近截图：${DEV.shotTs ? ago(DEV.shotTs) : '暂无'}</div>
      <button class="f" onclick="askShot()">${DEV.shotWanted ? '等待孩子端…' : '请求截屏'}</button></div>
    <div id="shotBox" style="margin-top:10px"></div>
    <div class="sub" style="margin-top:8px">需要孩子在手机上点击「允许截屏」授权，且每分钟最多 1 张。</div>
  </div>`;

  // 今日使用概况
  const today = groupByApp(sessionsIn(0));
  const total = today.reduce((a,b)=>a+b[1],0);
  h += `<div class="card"><h3>今日使用概况</h3>`;
  if(!today.length){
    h += `<div class="sub">今天还没有使用记录</div>`;
  } else {
    h += `<div class="sub" style="margin-bottom:10px">共 ${dur(total)} · ${today.length} 个应用</div>`;
    h += today.slice(0,6).map(([pk, ms]) => {
      const pct = Math.round(ms/total*100);
      return `<div style="margin-bottom:9px">
        <div class="row" style="margin-bottom:3px"><b>${esc(appName(pk))}</b><span class="sub">${dur(ms)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
  }
  h += `</div>`;

  // 使用概况（近 7 / 30 日）
  h += statCard('近 7 日使用概况', 7);
  h += statCard('近 30 日使用概况', 30);

  return h;
}

let shotTimer = null;
async function askShot(){
  try{
    await api('shot/request', { method:'POST', body:{ deviceId: DEV.id } });
    render();
    // 轮询最多 60 秒
    let n = 0;
    clearInterval(shotTimer);
    shotTimer = setInterval(async () => {
      n++;
      try{
        const r = await api('shot/get', { method:'POST', body:{ deviceId: DEV.id } });
        if(r && r.img){ clearInterval(shotTimer); showShot(r); }
      }catch(e){}
      if(n > 20) clearInterval(shotTimer);
    }, 3000);
  }catch(e){ alert('请求失败，请检查网络'); }
}

function showShot(r){
  const box = document.getElementById('shotBox');
  if(!box) return;
  box.innerHTML = `<img src="data:image/jpeg;base64,${r.img}" style="width:100%;border-radius:12px;border:1px solid var(--line)" alt="截屏">
    <div class="sub" style="margin-top:6px">截图时间：${hhmm(r.ts)}</div>`;
}

async function loadShot(){
  if(!DEV || !DEV.shotTs) return;
  try{
    const r = await api('shot/get', { method:'POST', body:{ deviceId: DEV.id } });
    if(r && r.img) showShot(r);
  }catch(e){}
}

function statCard(title, days){
  const list = groupByApp(sessionsIn(days));
  const total = list.reduce((a,b)=>a+b[1],0);
  if(!total) return `<div class="card"><h3>${title}</h3><div class="sub">暂无数据</div></div>`;
  // 按天汇总
  const byDay = {};
  sessionsIn(days).forEach(x=>{
    const d = new Date(x.end||0);
    const key = `${d.getMonth()+1}/${d.getDate()}`;
    byDay[key] = (byDay[key]||0) + (x.ms||0);
  });
  const days_ = Object.entries(byDay).slice(-30);
  const maxDay = Math.max(...days_.map(d=>d[1]), 1);

  return `<div class="card"><h3>${title}</h3>
    <div class="sub" style="margin-bottom:10px">合计 ${dur(total)} · ${list.length} 个应用</div>
    ${list.slice(0,5).map(([pk,ms])=>{
      const pct = Math.round(ms/total*100);
      return `<div class="row" style="margin-bottom:4px"><span>${esc(appName(pk))}</span><span class="sub">${dur(ms)}</span></div>
        <div class="bar" style="margin-bottom:8px"><i style="width:${pct}%"></i></div>`;
    }).join('')}
    <div class="sub" style="margin:12px 0 6px;border-top:1px solid var(--line);padding-top:10px">按天分布</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:70px">
      ${days_.map(([k,v])=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${k} ${dur(v)}">
        <div style="height:${Math.max(3,Math.round(v/maxDay*100))}%;background:var(--pri);border-radius:2px"></div></div>`).join('')}
    </div>
  </div>`;
}

function setRule(k, v){
  api('rules', { method:'POST', body:{ deviceId: DEV.id, rules:{ [k]: v } } }).then(load);
}
function addLim(){
  const pk = ($('pk').value||'').trim(), mn = +$('mn').value || 0;
  if(!pk){ alert('请填写包名'); return; }
  if(!mn){ alert('请填写分钟数'); return; }
  api('rules', { method:'POST', body:{ deviceId: DEV.id, rules:{ limits:{ ...(DEV.rules.limits||{}), [pk]: mn } } } }).then(load);
}
function setLim(pk, d){
  const cur = (DEV.rules.limits||{})[pk] || 0;
  const v = Math.max(0, cur + d);
  api('rules', { method:'POST', body:{ deviceId: DEV.id, rules:{ limits:{ ...(DEV.rules.limits||{}), [pk]: v } } } }).then(load);
}
function delLim(pk){
  const m = { ...(DEV.rules.limits||{}) }; delete m[pk];
  api('rules', { method:'POST', body:{ deviceId: DEV.id, rules:{ limits: m } } }).then(load);
}

/* ══════════════ 渲染 ══════════════ */
function render(){
  const n = $('nav');
  if(!K){ $('v').innerHTML = viewLogin(); n.style.display = 'none'; return; }

  if(SHEET){
    $('v').innerHTML = SHEET;
    n.style.display = 'none';
    return;
  }
  n.style.display = 'flex';
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.t === TAB));

  // 待审批提示（任何页面都显示）
  let alertHTML = '';
  if(RQ.length){
    alertHTML = RQ.map(r => `<div class="card" style="background:var(--warn2)">
      <b>孩子申请再用 ${r.minutes} 分钟</b>
      <div class="sub" style="margin:4px 0 10px">${esc(appName(r.pkg))}</div>
      <div class="row"><button class="f" style="flex:1" onclick="dec('${r.id}',true)">同意</button>
      <button style="flex:1" onclick="dec('${r.id}',false)">拒绝</button></div></div>`).join('');
  }

  let body = '';
  if(TAB === 'home') body = viewHome();
  else if(TAB === 'loc') body = viewLoc();
  else if(TAB === 'guard') body = viewGuard();
  else if(TAB === 'log') body = viewLog();
  else body = viewMe();

  $('v').innerHTML = alertHTML + body;
  if(TAB === 'guard' && DEV && DEV.shotTs) loadShot();
}

const dec = (rid, ok) => api('requests', { method:'POST', body:{ id:rid, approve:ok } }).then(load);

/* ══════════════ 数据加载 ══════════════ */
let busy = false;
async function load(){
  if(!K || busy) return;
  busy = true;
  try{
    const s = await api('state');
    D = s.devices || []; RQ = s.requests || []; AL = s.alerts || [];
    DEV = D[0] || null;
    try { VER = await (await fetch('/api/version', {cache:'no-store'})).json(); } catch(e){}
    render();
  }catch(e){
    // 网络异常保持当前界面，不清空
  }finally{
    busy = false;
  }
}

load();
// 页面隐藏时暂停轮询（省电），回到前台立即刷新
setInterval(() => { if(!document.hidden && K) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && K) load(); });
</script>
